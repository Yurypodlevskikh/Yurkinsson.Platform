name: SpeedUpVue CI

on:
  push:
    paths:
      - 'web/SpeedUpVue/**'
      - '.github/workflows/speedup-vue-ci.yml'
  pull_request:
    paths:
      - 'web/SpeedUpVue/**'
      - '.github/workflows/speedup-vue-ci.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    env:
      VITE_API_BASE_URL: https://speedup-backend.yurkinsson.com

    defaults:
      run:
        working-directory: web/SpeedUpVue/speedupvue

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/SpeedUpVue/speedupvue/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Check API URL
        shell: pwsh
        run: |
          $js = Get-ChildItem dist\assets -Filter *.js | Get-Content -Raw
          if ($js -match "speedup-backend.yurkinsson.com") {
            Write-Host "API URL FOUND in production build"
          } else {
            Write-Error "API URL NOT FOUND in production build"
            exit 1
          }

      - name: Upload publish artifact
        uses: actions/upload-artifact@v4
        with:
          name: speedup-vue
          path: web/SpeedUpVue/speedupvue/dist
  deploy:
    needs: build
    runs-on: windows-latest

    steps:
      - name: Download publish artifact
        uses: actions/download-artifact@v4
        with:
          name: speedup-vue
          path: ./publish

      - name: Deploy to IIS
        shell: pwsh
        env:
          MSDEPLOY_USERNAME: ${{ secrets.MSDEPLOY_USERNAME }}
          MSDEPLOY_PASSWORD: ${{ secrets.MSDEPLOY_PASSWORD }}
        run: |
          $msdeploy = "C:\Program Files\IIS\Microsoft Web Deploy V3\msdeploy.exe"
          $publishPath = (Resolve-Path "./publish").Path

          $source = "-source:contentPath=$publishPath"
          $destination = "-dest:contentPath=speedup.yurkinsson.com,userName=$env:MSDEPLOY_USERNAME,password=$env:MSDEPLOY_PASSWORD,computerName=https://speedup.yurkinsson.com:8172/msdeploy.axd?site=speedup.yurkinsson.com,authtype=Basic"

          Write-Host "Deploying from: $publishPath"

          & $msdeploy `
            $source `
            $destination `
            "-skip:Directory=App_Data" `
            "-skip:File=web.config" `
            "-skip:File=.user.ini" `
            "-allowUntrusted" `
            "-verb:sync"